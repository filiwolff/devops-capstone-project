apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: This task will clean up a workspace directory.
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        echo "***** Cleaning up workspace *****"
        rm -rf *
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: flake8
spec:
  description: This task will run flake8 linter.
  workspaces:
    - name: source
  params:
    - name: image
      description: The container image to use
      type: string
      default: "python:3.9-slim"
    - name: args
      description: Arguments to pass to flake8
      type: array
      default: ["--count", "--max-complexity=10", "--max-line-length=127", "--statistics"]
  steps:
    - name: flake8
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        echo "***** Installing flake8 *****"
        python -m pip install --upgrade pip
        pip install flake8
        echo "***** Running flake8 *****"
        flake8 "$@" .
      args: ["$(params.args)"]
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: This task will run nosetests for unit testing.
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments to pass to nosetests
      type: string
      default: "-v"
    - name: database_uri
      description: The database URI to use for testing
      type: string
      default: "sqlite:///test.db"
  steps:
    - name: nosetests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: $(params.database_uri)
      script: |
        #!/bin/bash
        set -e
        echo "***** Installing dependencies *****"
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        echo "***** Running nosetests *****"
        nosetests $(params.args)
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: buildah
spec:
  description: This task builds and pushes an image using Buildah.
  workspaces:
    - name: source
  params:
    - name: IMAGE
      description: Reference of the image buildah will produce.
      type: string
  steps:
    - name: build
      image: quay.io/buildah/stable:v1.23.3
      workingDir: $(workspaces.source.path)
      securityContext:
        privileged: true
      script: |
        #!/bin/bash
        set -e
        echo "***** Building image $(params.IMAGE) *****"
        buildah --storage-driver=vfs bud --tls-verify=false -t $(params.IMAGE) .
        echo "***** Pushing image $(params.IMAGE) *****"
        buildah --storage-driver=vfs push --tls-verify=false $(params.IMAGE) docker://$(params.IMAGE)
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: deploy
spec:
  description: Deploys an image to OpenShift/Kubernetes cluster using oc.
  workspaces:
    - name: source
  params:
    - name: image
      description: The image to deploy
      type: string
  steps:
    - name: deploy
      image: quay.io/openshift/origin-cli:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        echo "***** Deploying image $(params.image) *****"
        oc set image deployment/accounts accounts=$(params.image)
        oc rollout status deployment/accounts